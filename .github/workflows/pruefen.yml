# Prüft bei jedem Push: Tests unter Node 24 (mit Schriftpaketen) und Bau beider Docker-Images.
name: Prüfen
on:
  push:
  pull_request:
jobs:
  tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install --no-audit --no-fund
      - run: npm test
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: App-Image (amd64 und arm64)
        uses: docker/build-push-action@v6
        with:
          context: app
          platforms: linux/amd64,linux/arm64
          push: false
      - name: Add-on-Image wie auf Home Assistant (aarch64, ohne Zusatzargumente wie der Supervisor)
        uses: docker/build-push-action@v6
        with:
          context: kinderkunst-test
          platforms: linux/arm64
          push: false
          build-args: |
            BUILD_ARCH=aarch64
            BUILD_VERSION=pruefung
      - name: App-Image (amd64) mit aktuellem Code bauen und starten
        uses: docker/build-push-action@v6
        with:
          context: app
          platforms: linux/amd64
          load: true
          tags: kinderkunst:pruefung
      - name: Container startet, antwortet und erzeugt Vorschaubilder
        run: |
          docker run -d --name kk -p 8099:8099 -e DEV_BENUTZER=Pruefung -e KANAL=test kinderkunst:pruefung
          for i in $(seq 1 30); do curl -fs localhost:8099/api/status && break; sleep 1; done
          docker logs kk
          curl -fs localhost:8099/api/status | grep -q '"vorschaubilder":true'
          curl -fs localhost:8099/ | grep -q Kinderkunst
          curl -fsI localhost:8099/schriften/nunito/nunito-latin-400-normal.woff2
          docker exec kk node -e "require('sharp')({create:{width:1600,height:1200,channels:3,background:'#D28A74'}}).jpeg().toFile('/tmp/probe.jpg')"
          docker cp kk:/tmp/probe.jpg /tmp/probe.jpg
          ID=$(curl -fs -X POST -H 'Content-Type: image/jpeg' --data-binary @/tmp/probe.jpg localhost:8099/api/medien | python3 -c "import sys,json;print(json.load(sys.stdin)['medium']['id'])")
          curl -fs -D - -o /tmp/vorschau.webp "localhost:8099/api/medien/$ID/vorschau?groesse=400" | grep -i 'content-type: image/webp'
